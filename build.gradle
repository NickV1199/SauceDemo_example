plugins {
    id 'java'
    id 'io.qameta.allure' version '2.12.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.26.0'
    testImplementation 'org.testng:testng:7.11.0'
    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    testImplementation 'io.qameta.allure:allure-selenide:2.29.1'
    implementation 'io.qameta.allure:allure-java-commons:2.29.1'
}

test {
    useTestNG {
        def testGroup = project.findProperty('testGroup')

        if (testGroup) {
            includeGroups testGroup.toString()
        }
    }
}